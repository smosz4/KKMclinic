[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Form settings
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Enable forms processing
[build.environment]
  FORMS = "true"
